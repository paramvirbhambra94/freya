plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

// Signing secrets live OUTSIDE the repo (public). Path can be overridden for CI.
def ksFile = file(System.getenv('FREYA_KEYSTORE_PROPS') ?: '/home/box/freya-secrets/keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
  namespace 'app.freya.android'
  compileSdk 35
  defaultConfig {
    applicationId 'app.freya.android'
    minSdk 31
    targetSdk 35
    versionCode 11
    versionName '1.1.0'
    ndk { abiFilters 'arm64-v8a' }
  }
  signingConfigs {
    release {
      if (ks['storeFile']) {
        storeFile file(ks['storeFile']); storePassword ks['storePassword']
        keyAlias ks['keyAlias']; keyPassword ks['keyPassword']
      }
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      signingConfig ks['storeFile'] ? signingConfigs.release : null
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = '17' }
  lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.webkit:webkit:1.14.0'
  implementation 'com.alphacephei:vosk-android:0.3.47@aar'
  implementation 'net.java.dev.jna:jna:5.13.0@aar'
}

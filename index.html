<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0805">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>F.R.E.Y.A.</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
  <div class="stage">
    <div id="rings" aria-hidden="true"></div>
    <div class="work" aria-hidden="true"><i></i></div>
    <div class="orb" id="orb" role="button" tabindex="0" aria-label="Talk to FREYA" data-state="idle"><div class="swirl"></div></div>
  </div>
  <div class="info">
    <h1>F.R.E.Y.A.</h1>
    <p id="status" aria-live="polite">Standing by.</p>
    <div id="captions" aria-live="polite"><div class="her"></div><div class="him"></div></div>
  </div>
</main>
<form id="textbar" hidden autocomplete="off"><input id="textin" placeholder="Type to Freya…" enterkeyhint="send"><button>Send</button></form>
<div id="toast" aria-live="polite"></div>
<button id="redo" hidden>Redo setup</button>

<section id="wrap" hidden>
  <div class="wrap-inner">
    <p class="kicker">Your plan</p>
    <h2 id="plan-headline"></h2>
    <div id="plan-sections"></div>
    <button id="pdf" class="ghost">Download PDF</button>
    <h3>Your pledge</h3>
    <p class="hint">A personal commitment between you and yourself, not a legal document. Edit it if you like, then sign.</p>
    <textarea id="pledge" rows="6"></textarea>
    <div class="sig-wrap"><canvas id="sig"></canvas><button id="sig-clear" class="link">Clear</button></div>
    <p class="hint">Sign with your finger above.</p>
    <h3>Emergency contacts</h3>
    <p class="hint">At least two. Freya only reaches them as a last resort, and never shares anything private.</p>
    <div id="contacts"></div>
    <button id="add-contact" class="link">+ Add another</button>
    <p id="wrap-err" class="err"></p>
    <button id="commit">Sign &amp; commit</button>
  </div>
</section>
<script src="/app.js"></script>
</body>
</html>

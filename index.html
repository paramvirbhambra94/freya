<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0805">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>F.R.E.Y.A.</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root{--gold:#e8b45a;--bg:#0b0805}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:radial-gradient(ellipse at 50% 40%,#2a1a08 0%,var(--bg) 70%);color:#f3e6cf;font-family:-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:24px}
  .orb{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff2d0 0%,var(--gold) 30%,#a8641c 65%,#3b1f06 100%);box-shadow:0 0 60px 10px rgba(232,180,90,.45),0 0 140px 40px rgba(232,180,90,.15);animation:breathe 5s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1);filter:brightness(.95)}50%{transform:scale(1.06);filter:brightness(1.1)}}
  h1{font-weight:300;letter-spacing:.5em;font-size:22px;margin-right:-.5em;color:var(--gold)}
  p{font-size:13px;letter-spacing:.08em;opacity:.65;text-align:center}
</style>
</head>
<body>
<main>
  <div class="orb" aria-hidden="true"></div>
  <div style="text-align:center;display:grid;gap:12px">
    <h1>F.R.E.Y.A.</h1>
    <p id="greet">Standing by.</p>
  </div>
</main>
<script>
  const h=new Date().getHours();
  document.getElementById('greet').textContent=(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+', Eesah. Standing by.';
  if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
